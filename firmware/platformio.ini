[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
    thomasfredericks/Bounce2@^2.71

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200

[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DHAVEN_DEBUG=1
